set -g default-terminal "tmux-256color"

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# resizing panes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -L 10
bind h resize-pane -R 10

setw -g mode-keys vi

bind ' ' split-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# kill current window (all panes and exit)
bind Q kill-window
# kill entire session (all windows)
bind X kill-session

# reload config file
bind r source-file ~/.tmux.conf

# copy mode vi bindings — cross-platform clipboard
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'V' send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# macOS: pbcopy works natively on Ventura+
if-shell '[ "$(uname)" = "Darwin" ]' {
  bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
}

# Linux: use xclip, xsel, or wl-copy (Wayland), with WSL clipboard as last resort
if-shell '[ "$(uname)" = "Linux" ]' {
  if-shell 'command -v wl-copy &>/dev/null' {
    bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"
  } {
    if-shell 'command -v xclip &>/dev/null' {
      bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard"
    } {
      if-shell 'command -v clip.exe &>/dev/null' {
        bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "clip.exe"
      } {
        if-shell 'command -v xsel &>/dev/null' {
          bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xsel --clipboard --input"
        }
      }
    }
  }
}

set -g mouse on
#set -g mouse-resize-pane on
#set -g mouse-select-pane on
#set -g mouse-select-window on

# Powerline (optional — skip silently if not installed)
run-shell 'command -v powerline-config &>/dev/null && powerline-config tmux setup || true'
run-shell -b 'command -v powerline-daemon &>/dev/null && powerline-daemon -q &>/dev/null || true'

set -sg escape-time 0
set-option -g focus-events on

# Enable true-color support where available
set -as terminal-features ",*:RGB"

# Extended keys for modern terminals
set -g extended-keys always
set -g xterm-keys on
set -as terminal-features ',*:extkeys'

set -g display-panes-time 3000
